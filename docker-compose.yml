version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. Redis Semantic Cache Service
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - nexus-network

  # -------------------------------------------------------------------
  # 2. FastAPI Backend Service (Python 3.12 + LangGraph + Groq)
  # -------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL_ROUTER=${GROQ_MODEL_ROUTER:-openai/gpt-oss-20b}
      - GROQ_MODEL_GENERATOR=${GROQ_MODEL_GENERATOR:-openai/gpt-oss-120b}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      - CHROMA_PERSIST_DIRECTORY=chroma_db
      - SQLITE_DB_PATH=data/nexus_structured.db
      - BM25_INDEX_PATH=data/bm25_index.pkl
    volumes:
      - chroma_db:/app/chroma_db
      - nexus_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexus-network

  # -------------------------------------------------------------------
  # 3. React Frontend Service (Nginx + Vite + Live SSE Inspector)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - nexus-network

# ---------------------------------------------------------------------
# Persistent Named Volumes & Networks
# ---------------------------------------------------------------------
volumes:
  redis_data:
    driver: local
  chroma_db:
    driver: local
  nexus_data:
    driver: local

networks:
  nexus-network:
    driver: bridge
